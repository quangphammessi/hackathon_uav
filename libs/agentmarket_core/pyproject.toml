[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmarket-core"
version = "1.0.0"
description = "Shared domain models, config and infrastructure adapters for AgentMarket OS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pgvector>=0.3",
    "numpy>=1.26",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
tfidf = ["scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmarket_core*"]

[tool.setuptools.package-data]
agentmarket_core = ["db/*.sql"]
